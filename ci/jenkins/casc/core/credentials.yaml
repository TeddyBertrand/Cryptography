# Structural placeholder domain. JCasC concatenates domainCredentials lists
# across files rather than deep-merging by domain name — so project overlays
# must NOT redeclare this "_" domain (a second entry with the same name
# collides and silently drops credentials). Overlays needing credentials
# should declare their own domain name instead (see
# casc/projects/cryptography/credentials.yaml) — credential lookup by id
# from pipeline steps works across domains regardless.
credentials:
  system:
    domainCredentials:
      - domain:
          name: "_"
