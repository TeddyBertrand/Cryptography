# Public repo — anonymous HTTPS clone, no credential needed. If that
# changes, add a credentials.yaml alongside this file (see core/credentials.yaml
# for the shared domain wrapper) and reference its id in `credentials()` below.
#
# Two jobs, one per long-lived branch: `cryptography-dev` mirrors the
# integration branch PRs land on, `cryptography-main` mirrors the release
# branch. Same Jenkinsfile, different branch/job name.
#
# `cryptography-nightly` runs benchmarks and the slow release suite on `dev`
# on a cron (`H` spreads the start within the 3am hour), with its own
# Jenkinsfile. The cron lives here, not in the Jenkinsfile, so it is active
# from the first boot instead of after the job's first manual run.
jobs:
  - script: >
      pipelineJob('cryptography-dev') {
        properties {
          githubProjectUrl('https://github.com/TeddyBertrand/Cryptography')
        }
        triggers {
          githubPush()
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/TeddyBertrand/Cryptography.git') }
                branches('*/dev')
              }
            }
            scriptPath('ci/jenkins/jenkinsfiles/cryptography.Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('cryptography-main') {
        properties {
          githubProjectUrl('https://github.com/TeddyBertrand/Cryptography')
        }
        triggers {
          githubPush()
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/TeddyBertrand/Cryptography.git') }
                branches('*/main')
              }
            }
            scriptPath('ci/jenkins/jenkinsfiles/cryptography.Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('cryptography-nightly') {
        properties {
          githubProjectUrl('https://github.com/TeddyBertrand/Cryptography')
        }
        triggers {
          cron('H 3 * * *')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/TeddyBertrand/Cryptography.git') }
                branches('*/dev')
              }
            }
            scriptPath('ci/jenkins/jenkinsfiles/cryptography-nightly.Jenkinsfile')
          }
        }
      }
