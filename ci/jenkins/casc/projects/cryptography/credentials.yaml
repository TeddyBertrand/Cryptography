# JCasC concatenates domainCredentials lists across files rather than
# deep-merging by domain name — reusing core/credentials.yaml's "_" domain
# here would add a second, colliding "_" entry and silently lose these
# credentials. Each project overlay must use its own domain name instead;
# credential lookup by id from pipeline steps works across domains.
credentials:
  system:
    domainCredentials:
      - domain:
          name: "cryptography"
        credentials:
          - string:
              scope: GLOBAL
              id: "github-status-token"
              description: "GitHub PAT (repo:status) for posting commit statuses"
              secret: "${GITHUB_TOKEN}"
