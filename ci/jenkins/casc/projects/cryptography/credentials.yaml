# JCasC concatenates domainCredentials lists across files rather than
# deep-merging by domain name — reusing core/credentials.yaml's "_" domain
# here would add a second, colliding "_" entry and silently lose these
# credentials. Each project overlay must use its own domain name instead;
# credential lookup by id from pipeline steps works across domains.
credentials:
  system:
    domainCredentials:
      - domain:
          name: "cryptography"
        credentials:
          # githubNotify only resolves username/password credentials; the
          # PAT goes in `password`, the username is informational.
          - usernamePassword:
              scope: GLOBAL
              id: "github-status-token"
              description: "GitHub PAT (repo:status) for posting commit statuses"
              username: "TeddyBertrand"
              password: "${GITHUB_TOKEN}"
          # Discord channel webhook for red/fixed build notifications; left
          # empty, the Jenkinsfile skips the notification.
          - string:
              scope: GLOBAL
              id: "discord-webhook-url"
              description: "Discord webhook URL for build notifications"
              secret: "${DISCORD_WEBHOOK_URL}"
