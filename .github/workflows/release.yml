name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Builds every target when this workflow changes, so a broken target shows
  # on the PR instead of on the tag. Only a tag publishes a release.
  pull_request:
    branches: [dev, main]
    paths: [".github/workflows/release.yml"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      # The tag, or `pr-N` on a pull request, whose ref name `N/merge` has a slash.
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('pr-{0}', github.event.number) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "my_pgp-$VERSION-${{ matrix.target }}.tar.gz" \
            -C target/${{ matrix.target }}/release my_pgp

      - uses: actions/upload-artifact@v7
        with:
          name: my_pgp-${{ matrix.target }}
          path: my_pgp-${{ env.VERSION }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Creating the release and uploading its assets needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
