name: Sync to org repo

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.ORG_DEPLOY_KEY }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into org repo and push
        env:
          ORG_REPO: EpitechPGE3-2026/G-CNA-500-MPL-5-1-mypgp-3
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add org "git@github.com:${ORG_REPO}.git"
          # `ls-remote --exit-code` distinguishes "repo reachable, main just
          # doesn't exist yet" (exit 2, the real first-sync case) from any
          # other failure (exit 128: bad auth, deploy key not added yet to
          # the org repo, repo actually missing, ...), which must fail
          # loudly instead of being silently treated as "first sync" -- that
          # misread it into a confusing double failure (fetch AND the
          # fallback push both failing the same way) instead of a clear
          # auth error.
          set +e
          ls_remote_output=$(git ls-remote --exit-code org main 2>&1)
          ls_remote_status=$?
          set -e
          if [ "$ls_remote_status" -eq 0 ]; then
            git fetch org main
            git merge --allow-unrelated-histories --no-edit org/main || {
              echo "::error::merge conflict syncing into org repo -- resolve manually (see CONTRIBUTING.md)"
              exit 1
            }
          elif [ "$ls_remote_status" -eq 2 ]; then
            echo "org repo has no 'main' yet -- first sync, pushing directly"
          else
            echo "::error::could not reach org repo '${ORG_REPO}' (exit $ls_remote_status): $ls_remote_output"
            exit 1
          fi
          git push org HEAD:main
