name: Sync to org repo

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge into org repo and push
        env:
          ORG_PUSH_TOKEN: ${{ secrets.ORG_PUSH_TOKEN }}
          ORG_REPO: EpitechPGE3-2026/G-CNA-500-MPL-5-1-mypgp-3
        run: |
          set -euo pipefail
          git remote add org "https://x-access-token:${ORG_PUSH_TOKEN}@github.com/${ORG_REPO}.git"
          # `ls-remote --exit-code` distinguishes "repo reachable, main just
          # doesn't exist yet" (exit 2, the real first-sync case) from any
          # other failure (exit 128: bad auth, no SSO authorization for the
          # org, repo actually missing, ...), which must fail loudly instead
          # of being silently treated as "first sync" -- that misread it
          # into a confusing double 404 (fetch AND the fallback push both
          # failing the same way) instead of a clear auth error.
          set +e
          ls_remote_output=$(git ls-remote --exit-code org main 2>&1)
          ls_remote_status=$?
          set -e
          if [ "$ls_remote_status" -eq 0 ]; then
            git fetch org main
            git merge --allow-unrelated-histories --no-edit org/main || {
              echo "::error::merge conflict syncing into org repo -- resolve manually (see CONTRIBUTING.md)"
              exit 1
            }
          elif [ "$ls_remote_status" -eq 2 ]; then
            echo "org repo has no 'main' yet -- first sync, pushing directly"
          else
            echo "::error::could not reach org repo '${ORG_REPO}' (exit $ls_remote_status): $ls_remote_output"
            exit 1
          fi
          git push org HEAD:main
